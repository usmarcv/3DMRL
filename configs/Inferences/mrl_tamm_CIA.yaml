project_name: TAMM_MRL
clip_embed_dim: 1280
clip_embed_version: OpenCLIP
trainer: 'trainer_clip_adapter'
batch_size: 50
num_points: 10000
fix_seed: True
seed: 0
device: cuda

model:
  name: CLIPAdapter
  ratio: 0.2
  c_in: ${clip_embed_dim}
  out_channel: ${clip_embed_dim}
  voxel_size: 0.02
  use_dense: True
  # path: exp/searching_best_CIA_ShapeNet@20260115-174040/ckpt/latest.pt

pretrained_clip:
  name: CLIPAdapter
  ratio: 0.2
  c_in: 1280
  # path: exp/test_cia_projTrue_noLVIS_bs64@20251218-150614/ckpt/epoch_199.pt
  path: exp/searching_best_CIA_ShapeNet@20260115-174040/ckpt/latest.pt

mrl:
  use_mrl: True
  dims: [10, 20, 40, 80, 160, 320, 640, 1280]

training:
  use_openclip_optimizer_scheduler: True
  scheduler: 'cosine'
  warmup_epoch: 20
  max_epoch: 200
  # test_epoch: 70
  lr: 0.00025
  lr_decay: 15
  lr_decay_rate: 0.967
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  warmup: 2
  log_freq: 10
  save_freq: 1
  lambda_img_contras: 1
  lambda_text_contras: 1
  use_image_proj: True 
  use_text_proj: True
  logit_scale_init: 14.28
  use_mask: False
  mask_threshold: 0.1


#Ensembled Dataset (no-LVIS): data/meta_data/split/train_no_lvis.json
#ShapeNet: data/meta_data/split/ablation/train_shapenet_only.json

dataset:
  name: Four
  num_imgs: 1
  num_texts: 1
  train_split: data/meta_data/split/ablation/train_shapenet_only.json
  train_partial: -1
  use_openshape_feature: True
  num_points: ${num_points}
  num_workers: 10
  train_batch_size: ${batch_size}
  use_knn_negative_sample: True
  negative_sample_num: 1
  knn_path: data/meta_data/point_feat_knn.npy
  y_up: True
  normalize: True
  random_z_rotate: True
  use_color: True
  rgb_random_drop_prob: 0.5
  augment: True
  text_source: [text, caption]
  use_text_filtering: True
  use_prompt_engineering: True
  gpt4_filtering_path: data/meta_data/gpt4_filtering.json


modelnet40:
  test_split: data/meta_data/modelnet40/test_split.json
  test_pc: data/meta_data/modelnet40/test_pc.npy
  num_points: ${num_points}
  num_workers: 10
  test_batch_size: ${batch_size}
  clip_feat_path: data/meta_data/modelnet40/cat_name_pt_feat.npy
  y_up: True

objaverse_lvis:
  split: data/meta_data/split/lvis.json
  clip_feat_path: data/meta_data/lvis_cat_name_pt_feat.npy
  num_points: ${num_points}
  num_workers: 6
  batch_size: ${batch_size}
  y_up: True
  normalize: True
  use_color: True

scanobjectnn:
  data_path: data/meta_data/scanobjectnn/xyz_label.npy
  num_points: ${num_points}
  num_workers: 10
  test_batch_size: ${batch_size}
  clip_feat_path: data/meta_data/scanobjectnn/cat_name_pt_feat.npy
  y_up: True


