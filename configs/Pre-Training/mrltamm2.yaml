project_name: MRL_3D_CLIP
clip_embed_dim: 1280
clip_embed_version: OpenCLIP

trainer: '3dmrl_trainer'

batch_size: 50
num_points: 10000
num_workers: 10


nesting_list: [10, 20, 40, 80, 160, 320, 640, 1280]


mrl:
  use_mrl: True
  dims: [10, 20, 40, 80, 160, 320, 640, 1280]
  mrl_heads: [10, 20, 40, 80, 160, 320, 640, 1280]



fix_seed: True
seed: 0


model:
  name: PointBERT
  scaling: 4
  use_dense: True
  proj: True
  in_channel: 6
  out_channel: 1280
  embedding_channel: 1024
  voxel_size: 0.02


# use_pretrained: True
# pretrained_adapters:
#   name: CLIPAdapter
#   ratio: 0.2
#   c_in: 1280
#   path: exp/08abril_ensembled_ratio_02_adapters_lr_1e-3@20260408-104818/ckpt/epoch_180.pt
  # path: exp/05abril_AdaptersMRL_Ensembled_bs50_ratio_0.2_n1@20260405-175840/ckpt/epoch_190.pt
  # path: exp/03abril_AdaptersMRL_ShapeNet_bs50_ratio_0.6_n1@20260403-123609/ckpt/epoch_183.pt
  # path: exp/01abril_MRL_Adapters_Ensembled_bs50_ratio_0.2@20260401-100635/ckpt/epoch_190.pt
  # path: exp/30to31marco_MRL_Adapters_bs128_ratio_0.4@20260331-062804/ckpt/epoch_197.pt
  # path: exp/30to31marco_MRL_Adapters_bs50_ratio_0.4@20260330-224914/ckpt/epoch_199.pt
  # path: exp/30to31marco_MRL_Adapters_bs32_ratio_0.8@20260330-201040/ckpt/epoch_195.pt
  # path: exp/29marco_MRL_Adapters_bs256_ratio_0.2@20260330-074517/ckpt/epoch_192.pt
  # path: exp/30to31marco_MRL_Adapters_bs50_ratio_0.1@20260330-205146/ckpt/epoch_199.pt

training:
  use_openclip_optimizer_scheduler: True
  scheduler: "cosine"
  max_epoch: 200 # 200
  test_epoch: 25 # 70
  lr: 0.0005
  lr_decay: 30
  lr_decay_rate: 0.95
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  warmup_epoch: 10
  log_freq: 10
  save_freq: 1
  lambda_img_contras: 1
  lambda_text_contras: 1
  use_mrl_image_proj: False
  use_mrl_text_proj: False
  logit_scale_init: 14.28
  use_mask: False
  mask_threshold: 0.1
  use_image_proj: False
  use_text_proj: False


#Path to our data splits
#Ensembled (no-LVIS): data/meta_data/split/train_no_lvis.json
#Ensembled: data/meta_data/split/train_all.json
#ShapeNet: data/meta_data/split/ablation/train_shapenet_only.json


# ShapeNet
# training:
#   lr: 0.0005
#   warmup_epoch: 10    # ~2600 steps
#   max_epoch: 200

# # Ensembled no-LVIS  
# training:
#   lr: 0.0005
#   warmup_epoch: 5     # ~21900 steps — dataset grande já tem gradiente estável mais rápido
#   max_epoch: 200

# # Objaverse-LVIS
# training:
#   lr: 0.0005
#   warmup_epoch: 10    # ~2300 steps — similar ao ShapeNet
#   max_epoch: 200


dataset:
  name: Four
  num_imgs: 4
  num_texts: 1
  train_split: data/meta_data/split/ablation/train_shapenet_only.json
  train_partial: -1
  use_openshape_feature: True
  num_points: ${num_points}
  num_workers: ${num_workers}
  train_batch_size: ${batch_size}
  use_knn_negative_sample: True
  negative_sample_num: 1
  knn_path: data/meta_data/point_feat_knn.npy
  y_up: True
  normalize: True
  random_z_rotate: True
  use_color: True
  rgb_random_drop_prob: 0.5
  augment: True
  text_source: [ text, caption, retrieval_text ]
  use_text_filtering: True
  use_prompt_engineering: True
  gpt4_filtering_path: data/meta_data/gpt4_filtering.json


modelnet40:
  test_split: data/meta_data/modelnet40/test_split.json
  test_pc: data/meta_data/modelnet40/test_pc.npy
  num_points: ${num_points}
  num_workers: 6
  test_batch_size: 64
  clip_feat_path: data/meta_data/modelnet40/cat_name_pt_feat.npy
  y_up: True
  normalize: True
  use_color: True


objaverse_lvis:
  split: data/meta_data/split/lvis.json
  clip_feat_path: data/meta_data/lvis_cat_name_pt_feat.npy
  num_points: ${num_points}
  num_workers: ${num_workers}
  batch_size: 64
  y_up: True
  normalize: True
  use_color: True


scanobjectnn:
  data_path: data/meta_data/scanobjectnn/xyz_label.npy
  num_points: ${num_points}
  num_workers: 6
  test_batch_size: 64
  clip_feat_path: data/meta_data/scanobjectnn/cat_name_pt_feat.npy
  y_up: True
  normalize: True
  use_color: True