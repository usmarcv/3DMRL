project_name: 3DMRL
clip_embed_dim: 1280
clip_embed_version: OpenCLIP


# trainer: '3dmrl_trainer'
# trainer: '3dmrl_pca'


fix_seed: True
seed: 0


batch_size: 128 #global 4 gpus 200
num_points: 10000
num_workers: 10


mrl:
  nesting_dims: [10, 20, 40, 80, 160, 320, 640, 1280]
  # nesting_dims: [1280]
  # nesting_dims: [8, 16, 32, 64, 128, 256, 512, 1024, 1280]
  # nesting_dims: [640, 320, 160, 80, 40, 20, 10, 1280]
  out_dim: ${clip_embed_dim}
  efficient: False 


#comentar sem o pca
eval:
  pca_fit_samples: 20000
  pca_seed: 0
  pca_solver: randomized
  pca_whiten: false
  pca_niter: 2
  pca_normalize_before: true
  pca_load_cache: false


model:
  name: PointBERT
  scaling: 4
  use_dense: True
  proj: True # pointbert out (512) -> to 1280 (clip feat dim)
  in_channel: 6
  out_channel: ${clip_embed_dim}
  embedding_channel: 1024
  voxel_size: 0.02


training:
  use_openclip_optimizer_scheduler: True
  precision: "bf16"
  scheduler: "cosine"
  max_epoch: 200 # 200
  test_epoch: 30 # 70
  lr: 5e-4
  lr_decay: 30
  lr_decay_rate: 0.95
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  warmup_epoch: 10
  log_freq: 10
  save_freq: 1
  lambda_img_contras: 1
  lambda_text_contras: 1
  use_mrl_image_proj: False
  use_mrl_text_proj: False
  logit_scale_init: 14.28
  use_mask: False
  mask_threshold: 0.1
  use_image_proj: False
  use_text_proj: False

#Path to our data splits
#Ensembled (no-LVIS): data/meta_data/split/train_no_lvis.json
#Ensembled: data/meta_data/split/train_all.json
#ShapeNet: data/meta_data/split/ablation/train_shapenet_only.json

dataset:
  name: Four
  num_imgs: 4
  num_texts: 1
  train_split: data/meta_data/split/train_all.json
  train_partial: -1
  use_openshape_feature: True
  num_points: ${num_points}
  num_workers: ${num_workers}
  train_batch_size: ${batch_size}
  use_knn_negative_sample: True
  negative_sample_num: 1
  knn_path: data/meta_data/point_feat_knn.npy
  y_up: True
  normalize: True
  random_z_rotate: True
  use_color: True
  rgb_random_drop_prob: 0.5
  augment: True
  text_source: [ text, caption, retrieval_text ]
  use_text_filtering: True
  use_prompt_engineering: True
  gpt4_filtering_path: data/meta_data/gpt4_filtering.json


modelnet40:
  test_split: data/meta_data/modelnet40/test_split.json
  test_pc: data/meta_data/modelnet40/test_pc.npy
  num_points: ${num_points}
  num_workers: 6
  test_batch_size: 64
  clip_feat_path: data/meta_data/modelnet40/cat_name_pt_feat.npy
  y_up: True


objaverse_lvis:
  split: data/meta_data/split/lvis.json
  clip_feat_path: data/meta_data/lvis_cat_name_pt_feat.npy
  num_points: ${num_points}
  num_workers: ${num_workers}
  batch_size: 64
  y_up: True
  normalize: True
  use_color: True


scanobjectnn:
  data_path: data/meta_data/scanobjectnn/xyz_label.npy
  num_points: ${num_points}
  num_workers: 6
  test_batch_size: 64
  clip_feat_path: data/meta_data/scanobjectnn/cat_name_pt_feat.npy
  y_up: True