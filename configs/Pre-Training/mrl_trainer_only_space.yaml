project_name: MRL_3D_CLIP
clip_embed_dim: 1280
clip_embed_version: OpenCLIP

trainer: 'mrl_trainer'

batch_size: 50
num_points: 10000
num_workers: 10

fix_seed: True
seed: 0

mrl:
  use_mrl: True
  use_mrl_log_scale: False
  # dims: [40, 80, 160, 320, 640, 1280]
  dims: [10, 20, 40, 80, 160, 320, 640, 1280]


model:
  name: PointBERT
  scaling: 4
  proj_ppat: False
  use_dense: True
  in_channel: 6
  out_channel:  1280
  embedding_channel: 1024
  voxel_size: 0.02

# openhape run:
# python3 src/main.py --trial_name pointbert_all model.name=PointBERT model.scaling=4 model.use_dense=True training.lr=0.0005 training.lr_decay_rate=0.967 

# our code:
# CUDA_DEVICE_VISIBLES=0,1,2,3 torchrun --nproc_per_node=4 test.py --config configs/Inferences/mrl_trainer_inf_PointBERT.yaml --resume exp/test_MRL_PointBERT@20260219-133938/ckpt/epoch_104.pt
# CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nproc_per_node=4 main.py --master_port=29502 --config configs/Pre-Training/mrl_trainer_only_space  --trial_name marco12_testando_pb_directspace

training:
  use_openclip_optimizer_scheduler: True
  scheduler: "cosine"
  max_epoch: 50 # 200
  test_epoch: 20 # 70
  lr: 0.0002
  lr_decay: 30
  lr_decay_rate: 0.95
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-08
  warmup_epoch: 2
  log_freq: 20
  save_freq: 1
  lambda_img_contras: 1
  lambda_text_contras: 1
  use_mrl_image_proj: False
  use_mrl_text_proj: False
  logit_scale_init: 14.28
  use_mask: False
  mask_threshold: 0.1
  use_image_proj: False
  use_text_proj: False


#Path to our data splits
#Ensembled (no-LVIS): data/meta_data/split/train_no_lvis.json
#Ensembled: data/meta_data/split/train_all.json
#ShapeNet: data/meta_data/split/ablation/train_shapenet_only.json


dataset:
  name: Four
  num_imgs: 4
  num_texts: 1
  train_split: data/meta_data/split/ablation/train_shapenet_only.json
  train_partial: -1
  use_openshape_feature: True
  num_points: ${num_points}
  num_workers: ${num_workers}
  train_batch_size: ${batch_size}
  use_knn_negative_sample: True
  negative_sample_num: 1
  knn_path: data/meta_data/point_feat_knn.npy
  y_up: True
  normalize: True
  random_z_rotate: True
  use_color: True
  rgb_random_drop_prob: 0.5
  augment: True
  text_source: [ text, caption, retrieval_text ]
  use_text_filtering: True
  use_prompt_engineering: True
  gpt4_filtering_path: data/meta_data/gpt4_filtering.json


modelnet40:
  test_split: data/meta_data/modelnet40/test_split.json
  test_pc: data/meta_data/modelnet40/test_pc.npy
  num_points: ${num_points}
  num_workers: 6
  test_batch_size: ${batch_size}
  clip_feat_path: data/meta_data/modelnet40/cat_name_pt_feat.npy
  y_up: True
  normalize: True
  use_color: True


objaverse_lvis:
  split: data/meta_data/split/lvis.json
  clip_feat_path: data/meta_data/lvis_cat_name_pt_feat.npy
  num_points: ${num_points}
  num_workers: ${num_workers}
  batch_size: ${batch_size}
  y_up: True
  normalize: True
  use_color: True


scanobjectnn:
  data_path: data/meta_data/scanobjectnn/xyz_label.npy
  num_points: ${num_points}
  num_workers: 6
  test_batch_size: ${batch_size}
  clip_feat_path: data/meta_data/scanobjectnn/cat_name_pt_feat.npy
  y_up: True
  normalize: True
  use_color: True